<!doctype html>
<html lang="fr-CA">
<head>

<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="masthead">
    <a href="#accueil" class="band" aria-label="Accueil de l'application de Sana">
      <span class="band-tag" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.4C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.1 5.4 3.1 1.8-2 3.3-3.1 5.4-3.1 3.6 0 5.7 3.7 4.2 7.1C19.5 16.4 12 21 12 21z"/></svg>

      <span><span class="band-id">Sana</span><span class="band-sub">Candidate en politiques de santé, Québec</span></span>
      <span class="band-code" aria-hidden="true"></span>
    </a>
  </header>
  <nav class="nav" aria-label="Navigation principale">
    <div class="nav-inner">
      <a href="#accueil" data-nav="accueil">Leçons</a>

  <dialog id="term-dialog" aria-labelledby="term-title">

      <h2 id="term-title"></h2>
      <p id="term-def"></p>
      <p class="term-en"><span lang="en" id="term-en"></span></p>
      <button class="btn" value="close">Fermer</button>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
